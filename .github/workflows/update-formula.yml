name: Update formula

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run update-formula.sh
        run: ./script/update-formula.sh

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- Formula/reminder-cli.rb; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/reminder-cli.rb
          git commit -m "Update reminder-cli formula"
          git push
