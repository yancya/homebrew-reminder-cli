name: Update formula

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: homebrew-reminder-cli

      - name: Run update-formula.sh
        working-directory: homebrew-reminder-cli
        run: ./script/update-formula.sh

      - name: Check for changes
        id: diff
        working-directory: homebrew-reminder-cli
        run: |
          if git diff --quiet -- Formula/reminder-cli.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A commit made with the default GITHUB_TOKEN does not trigger other
      # workflows (including the push-triggered Formula test CI in this
      # repo), so validate the rendered formula here before committing.
      - name: Install as local tap
        if: steps.diff.outputs.changed == 'true'
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/yancya/homebrew-reminder-cli"
          mkdir -p "$(dirname "$TAP_DIR")"
          cp -R "$GITHUB_WORKSPACE/homebrew-reminder-cli" "$TAP_DIR"

      - name: brew style
        if: steps.diff.outputs.changed == 'true'
        run: brew style yancya/reminder-cli/reminder-cli

      - name: brew audit
        if: steps.diff.outputs.changed == 'true'
        run: brew audit --strict --online yancya/reminder-cli/reminder-cli

      - name: brew install
        if: steps.diff.outputs.changed == 'true'
        run: brew install --formula yancya/reminder-cli/reminder-cli

      - name: brew test
        if: steps.diff.outputs.changed == 'true'
        run: brew test yancya/reminder-cli/reminder-cli

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        working-directory: homebrew-reminder-cli
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/reminder-cli.rb
          git commit -m "Update reminder-cli formula"
          git push
